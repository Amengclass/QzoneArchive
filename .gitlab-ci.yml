# GitCode CI - QzoneArchive 全平台构建
# GitCode 基于 GitLab，使用 .gitlab-ci.yml 格式
# 注意：GitCode 共享 Runner 可能不支持所有平台，构建失败的 job 需要后续调整

stages:
  - build
  - release

variables:
  NODE_VERSION: "22"
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"

# ============================================================
# Linux 构建
# ============================================================
build:linux:
  stage: build
  image: node:${NODE_VERSION}
  tags:
    - docker
  before_script:
    - apt-get update && apt-get install -y
        libwebkit2gtk-4.1-dev
        libayatana-appindicator3-dev
        librsvg2-dev
        patchelf
        libgtk-3-dev
        libgstreamer1.0-dev
        libgstreamer-plugins-base1.0-dev
        libgstreamer-plugins-bad1.0-dev
        libgstreamer-plugins-ugly1.0-dev
        libgstreamer1.0-plugins-base
        libgstreamer1.0-plugins-good
        libgstreamer1.0-plugins-bad
        libgstreamer1.0-plugins-ugly
        libgstreamer1.0-libav
        fonts-noto-cjk
        curl build-essential pkg-config libssl-dev
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - export PATH="$HOME/.cargo/bin:$PATH"
    - rustc --version && cargo --version
  script:
    - npm ci
    - npx tauri build --bundles appimage,deb,rpm
  cache:
    key: linux-${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - src-tauri/target/
      - .cargo/
  artifacts:
    paths:
      - src-tauri/target/release/bundle/appimage/*.AppImage
      - src-tauri/target/release/bundle/deb/*.deb
      - src-tauri/target/release/bundle/rpm/*.rpm
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================================
# Windows 构建
# ============================================================
build:windows:
  stage: build
  image: node:${NODE_VERSION}
  tags:
    - docker
  before_script:
    - apt-get update && apt-get install -y curl build-essential pkg-config libssl-dev gcc-mingw-w64
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - export PATH="$HOME/.cargo/bin:$PATH"
    - rustup target add x86_64-pc-windows-gnu
    - rustc --version && cargo --version
  script:
    - npm ci
    - npx tauri build --target x86_64-pc-windows-gnu --bundles nsis
  cache:
    key: windows-${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - src-tauri/target/
      - .cargo/
  artifacts:
    paths:
      - src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*.exe
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================================
# macOS 构建 (x64)
# ============================================================
build:macos-x64:
  stage: build
  image: node:${NODE_VERSION}
  tags:
    - docker
  script:
    - echo "ERROR: macOS builds require a macOS runner. GitCode shared runners may not support this."
    - exit 1
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================================
# macOS 构建 (ARM64)
# ============================================================
build:macos-arm64:
  stage: build
  image: node:${NODE_VERSION}
  tags:
    - docker
  script:
    - echo "ERROR: macOS builds require a macOS runner. GitCode shared runners may not support this."
    - exit 1
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================================
# Android 构建
# ============================================================
build:android:
  stage: build
  image: node:${NODE_VERSION}
  tags:
    - docker
  script:
    - echo "ERROR: Android builds require Android SDK + NDK. Needs custom runner or Docker image."
    - exit 1
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================================
# iOS 构建
# ============================================================
build:ios:
  stage: build
  image: node:${NODE_VERSION}
  tags:
    - docker
  script:
    - echo "ERROR: iOS builds require a macOS runner with Xcode."
    - exit 1
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ============================================================
# Release (打 tag 时创建发布)
# ============================================================
release:
  stage: release
  image: node:${NODE_VERSION}
  tags:
    - docker
  before_script:
    - apt-get update && apt-get install -y
        libwebkit2gtk-4.1-dev
        libayatana-appindicator3-dev
        librsvg2-dev
        patchelf
        libgtk-3-dev
        libgstreamer1.0-dev
        libgstreamer-plugins-base1.0-dev
        libgstreamer-plugins-bad1.0-dev
        libgstreamer-plugins-ugly1.0-dev
        libgstreamer1.0-plugins-base
        libgstreamer1.0-plugins-good
        libgstreamer1.0-plugins-bad
        libgstreamer1.0-plugins-ugly
        libgstreamer1.0-libav
        fonts-noto-cjk
        curl build-essential pkg-config libssl-dev
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - export PATH="$HOME/.cargo/bin:$PATH"
  script:
    - npm ci
    - npx tauri build --bundles appimage,deb,rpm
    - |
      # 创建 GitCode Release
      TAG_NAME="${CI_COMMIT_TAG}"
      if [ -n "$TAG_NAME" ]; then
        echo "Creating release for tag: $TAG_NAME"
        # GitCode Release API (与 GitLab 兼容)
        RELEASE_ID=$(curl -s -X POST \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases" \
          --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" \
          --header "Content-Type: application/json" \
          -d "{
            \"name\": \"Release ${TAG_NAME}\",
            \"tag_name\": \"${TAG_NAME}\",
            \"description\": \"QzoneArchive ${TAG_NAME} 发布\"
          }" | grep -o '"tag_name":"[^"]*"' || echo "")
        echo "Release created: $RELEASE_ID"
      fi
  cache:
    key: release-${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - src-tauri/target/
      - .cargo/
  artifacts:
    paths:
      - src-tauri/target/release/bundle/appimage/*.AppImage
      - src-tauri/target/release/bundle/deb/*.deb
      - src-tauri/target/release/bundle/rpm/*.rpm
    expire_in: 90 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
